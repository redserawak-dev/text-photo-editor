name: Build FRAME APK

on:
  push:
    branches: [ main ]
    paths:
      - 'frame-liquid-glass-android/**'
      - '.github/workflows/build-frame-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frame-liquid-glass-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-frame
          path: frame-liquid-glass-android/app/build/outputs/apk/debug/app-debug.apk
